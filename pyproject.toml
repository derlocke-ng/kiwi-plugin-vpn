[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kiwi-plugin-vpn"
version = "0.2.0"
description = "exit through a WireGuard/OpenVPN tunnel (gluetun) — a kiwi-proxy provider module"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }

# This is a kiwi-proxy provider module, installed into kiwi-proxy's modules_dir by
# install.sh (through kiwi-updater), NOT a pip package. kiwi-proxy is a runtime
# prerequisite the module imports; it is not a pip dependency here. pyproject
# exists only for the dev tooling below.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["."]
